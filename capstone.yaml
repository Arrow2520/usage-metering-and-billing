run: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
seed: python seed.py
test: pytest -q
base_url: http://localhost:8000

endpoints:
  - method: POST
    path: /generate
    description: Simulate AI usage and record metered API calls/tokens with idempotency.

  - method: GET
    path: /usage
    description: Return tenant usage totals, quota limits, and calculated cost.

  - method: GET
    path: /checkout
    description: Create a Stripe Checkout subscription session for a tenant.

  - method: POST
    path: /webhooks/stripe
    description: Receive Stripe webhook events with signature verification.